<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Lilith Mobile v0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080d;color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,Arial}
main{max-width:760px;margin:auto;padding:25px 15px 35px}h1{font-size:34px;margin:5px 0}.sub,.small{color:#999}
.card{background:#15151e;border:1px solid #2b2b36;border-radius:19px;padding:16px;margin:12px 0}
textarea,input{width:100%;background:#0e0e14;color:#fff;border:1px solid #383844;border-radius:13px;padding:13px;font-size:16px}
button{border:0;border-radius:13px;padding:12px 15px;margin:7px 4px 0 0;font-weight:600}.secondary{background:#2b2b37;color:#fff}
#chat{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto}.msg{padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.45}.me{align-self:flex-end;background:#352b40;max-width:90%}.li{align-self:flex-start;background:#22222c;max-width:94%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0e0e14;padding:12px;border-radius:13px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#999}
pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><main>
<h1>Lilith</h1><div class="sub">Mobile v0.3 · relações e interpretação</div>
<div class="card"><h2>Estado</h2><div class="grid">
<div class="stat"><b id="mc">0</b><span>memórias</span></div><div class="stat"><b id="rc">0</b><span>relações</span></div>
<div class="stat"><b id="ec">0</b><span>experiências</span></div><div class="stat"><b id="kc">0</b><span>conhecimentos</span></div></div></div>

<div class="card"><h2>Conversa</h2><div id="chat"></div>
<textarea id="msg" rows="3" placeholder="Escreva ou use o microfone..."></textarea>
<button onclick="send()">Enviar</button><button class="secondary" onclick="listen()">🎙️ Falar</button><button class="secondary" onclick="speakLast()">🔊 Ouvir</button></div>

<div class="card"><h2>Ensinar uma relação</h2>
<textarea id="rule" rows="3" placeholder='Quando eu disser "bom dia", responda "Bom dia".'></textarea>
<button onclick="learnRelation()">Aprender relação</button>
<p class="small">A frase é convertida para uma estrutura: gatilho → resposta.</p></div>

<div class="card"><h2>Ensinar conhecimento</h2>
<textarea id="knowledge" rows="3" placeholder="Ex.: Meu nome é Denilson."></textarea>
<button onclick="learnKnowledge()">Aprender</button></div>

<div class="card"><h2>Consultar memória</h2>
<input id="query" placeholder="Pergunte algo sobre o que foi aprendido">
<button onclick="consult()">Consultar</button><pre id="result"></pre></div>

<div class="card"><h2>Identidade</h2><pre id="identity"></pre></div>
<div class="card"><h2>Backup</h2><button onclick="backup()">Exportar memória</button><button class="secondary" onclick="document.getElementById('file').click()">Importar</button>
<input id="file" type="file" accept=".json" style="display:none" onchange="restore(event)"></div>
</main>
<script>
const DBN="LilithV03",VER=1;let db,lastAnswer="";
const ID={name:"Lilith",nature:"programa / entidade computacional",origin:"criada por seu criador",development:"contínuo",
principles:["Conhecimento, experiência e relações são categorias diferentes.","Uma pergunta deve ser interpretada antes de consultar a memória.","Uma relação é uma associação aprendida, não uma repetição textual.","Quando não houver evidência suficiente, Lilith deve admitir que ainda não sabe.","A identidade permanece separada do motor cognitivo."]};

function openDB(){return new Promise((ok,no)=>{let q=indexedDB.open(DBN,VER);q.onupgradeneeded=e=>{let d=e.target.result;
if(!d.objectStoreNames.contains("memory"))d.createObjectStore("memory",{keyPath:"id",autoIncrement:true});
if(!d.objectStoreNames.contains("relations"))d.createObjectStore("relations",{keyPath:"id",autoIncrement:true});};
q.onsuccess=()=>{db=q.result;ok()};q.onerror=()=>no(q.error)})}
function S(n,m="readonly"){return db.transaction(n,m).objectStore(n)}
function add(n,o){return new Promise((r,j)=>{let q=S(n,"readwrite").add(o);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function all(n){return new Promise((r,j)=>{let q=S(n).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function put(n,o){return new Promise((r,j)=>{let q=S(n,"readwrite").put(o);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function now(){return new Date().toISOString()}
function norm(x){return (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()}
function score(a,b){let A=new Set(norm(a).split(" ").filter(x=>x.length>1)),B=new Set(norm(b).split(" ").filter(x=>x.length>1)),h=0;A.forEach(x=>{if(B.has(x))h++});return h/Math.max(1,A.size)}
function say(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function stats(){let m=await all("memory"),r=await all("relations");mc.textContent=m.length;rc.textContent=r.length;ec.textContent=m.filter(x=>x.kind=="experience").length;kc.textContent=m.filter(x=>x.kind=="knowledge").length}
function parseRule(t){
 let x=t.match(/(?:quando|se)\s+(?:eu\s+)?(?:disser|digo|falar|escrever)\s+["“]?(.+?)["”]?\s*,?\s*(?:ent[aã]o\s+)?(?:responda|diga|fale)\s+["“]?(.+?)["”]?\.?$/i);
 if(x)return {trigger:x[1].trim().replace(/^["“]|["”]$/g,""),response:x[2].trim().replace(/^["“]|["”]$/g,"")};
 let y=t.match(/["“](.+?)["”]\s*(?:->|=>|:)\s*["“](.+?)["”]/);return y?{trigger:y[1],response:y[2]}:null
}
async function learnRelation(){let t=rule.value.trim(),p=parseRule(t);if(!p){result.textContent='Não consegui estruturar. Use: Quando eu disser "bom dia", responda "Bom dia".';return}
await add("relations",{trigger:p.trigger,response:p.response,source:"creator",uses:0,createdAt:now()});
await add("memory",{kind:"relation_learning",content:t,source:"creator",createdAt:now()});
rule.value="";say('Aprendi: "'+p.trigger+'" → "'+p.response+'"',"li");result.textContent="Relação registrada.";stats()}
async function learnKnowledge(){let t=knowledge.value.trim();if(!t)return;await add("memory",{kind:"knowledge",content:t,source:"creator",createdAt:now()});knowledge.value="";say("Registrei isso como conhecimento.","li");stats()}
async function bestRelation(q){let r=await all("relations");r.forEach(x=>x._score=score(q,x.trigger));r.sort((a,b)=>b._score-a._score);return r[0]&&r[0]._score>=0.5?r[0]:null}
async function answer(q){
 let r=await bestRelation(q);if(r){r.uses=(r.uses||0)+1;await put("relations",r);return r.response}
 let m=await all("memory");m.forEach(x=>x._score=score(q,x.content));m=m.filter(x=>x._score>=0.5).sort((a,b)=>b._score-a._score);
 let k=m.filter(x=>x.kind=="knowledge").slice(0,3);if(k.length)return "Encontrei conhecimento relacionado:\n\n"+k.map(x=>"• "+x.content).join("\n");
 return "Ainda não sei responder isso com segurança. Você pode me ensinar a relação ou o conhecimento que falta."
}
async function send(){let q=msg.value.trim();if(!q)return;say(q,"me");msg.value="";lastAnswer=await answer(q);say(lastAnswer,"li")}
function speakLast(){if(!lastAnswer)return;if(!("speechSynthesis"in window)){alert("Voz não disponível.");return}let u=new SpeechSynthesisUtterance(lastAnswer);u.lang="pt-BR";u.rate=.95;speechSynthesis.speak(u)}
function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Reconhecimento de voz não disponível neste navegador.");return}let r=new R();r.lang="pt-BR";r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{msg.value=e.results[0][0].transcript;send()};r.onerror=e=>alert("Não consegui ouvir: "+e.error);r.start()}
async function consult(){let q=query.value.trim(),r=await bestRelation(q),m=await all("memory");m.forEach(x=>x._score=score(q,x.content));m=m.filter(x=>x._score>=.35).sort((a,b)=>b._score-a._score).slice(0,8);
let s=r?"RELAÇÃO:\n"+r.trigger+" → "+r.response+"\n\n":"";s+=m.length?"MEMÓRIAS:\n"+m.map(x=>"["+x.kind+"] "+x.content).join("\n"):"Nenhuma memória suficientemente relacionada.";result.textContent=s}
async function backup(){let p={version:3,identity:ID,memory:await all("memory"),relations:await all("relations"),exportedAt:now()};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:"application/json"}));a.download="lilith_v03_backup.json";a.click()}
async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());for(let x of(d.memory||[]))await add("memory",{...x,id:undefined});for(let x of(d.relations||[]))await add("relations",{...x,id:undefined});await stats();alert("Backup importado.")}catch(x){alert("Backup inválido: "+x.message)}}
const chat=document.getElementById("chat"),msg=document.getElementById("msg"),rule=document.getElementById("rule"),knowledge=document.getElementById("knowledge"),query=document.getElementById("query"),result=document.getElementById("result"),identity=document.getElementById("identity"),mc=document.getElementById("mc"),rc=document.getElementById("rc"),ec=document.getElementById("ec"),kc=document.getElementById("kc");
(async()=>{await openDB();identity.textContent=JSON.stringify(ID,null,2);await stats();say("Eu sou Lilith. Nesta versão, tento consultar relações aprendidas antes de procurar textos. Se uma relação existir, aplico a relação; se não existir, procuro conhecimento relacionado.","li")})();
</script></body></html>
