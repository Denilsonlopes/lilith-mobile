<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lilith"><link rel="manifest" href="manifest.webmanifest"><title>Lilith Mobile v0.2</title><style>body{margin:0;background:#09090d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,Arial;padding:20px}main{max-width:720px;margin:auto}.card{background:#17171f;border:1px solid #30303a;border-radius:18px;padding:16px;margin:12px 0}textarea,input{width:100%;box-sizing:border-box;background:#0f0f15;color:white;border:1px solid #363642;border-radius:12px;padding:12px;font-size:16px;margin:5px 0}button{border:0;border-radius:12px;padding:12px 16px;margin:5px 4px 0 0;font-weight:600}.msg{padding:12px;border-radius:15px;margin:7px 0;white-space:pre-wrap}.me{background:#30263b}.lilith{background:#24242d}.small{font-size:12px;color:#aaa}.rule{background:#0e0e14;padding:10px;border-radius:10px;margin:6px 0}</style></head><body><main><h1>Lilith</h1><p class="small">Mobile v0.2 · relações + voz</p><div class="card"><b>Estado</b><p id="stats">...</p></div><div class="card"><b>Conversa</b><div id="chat"></div><textarea id="msg" rows="3" placeholder="Fale ou escreva com Lilith..."></textarea><button onclick="send()">Enviar</button><button id="mic" onclick="toggleVoice()">🎙️ Falar</button><label class="small"><input id="speak" type="checkbox" checked> Lilith fala</label><p id="voiceStatus" class="small">Microfone pronto.</p></div><div class="card"><b>Ensinar uma relação</b><textarea id="know" rows="3" placeholder="Ex.: Quando eu disser bom dia, responda Bom dia."></textarea><button onclick="teach()">Ensinar</button><div id="rules"></div></div><div class="card"><b>Memória</b><input id="q" placeholder="Pesquisar memória"><button onclick="searchMem()">Pesquisar</button><button onclick="reflect()">Refletir</button><pre id="res"></pre></div><div class="card"><button onclick="exportData()">Exportar memória</button><button onclick="document.getElementById('file').click()">Importar</button><input id="file" type="file" accept=".json" hidden onchange="importData(event)"><button onclick="wipe()">Apagar memória</button></div></main><script>
const DB='LilithMobileDB',V=2,M='memories',R='reflections',T='meta',K='rules';let db,rec=null,listening=false;
const ID={name:'Lilith',nature:'programa / entidade computacional',origin:'criada por seu criador',development:'contínuo',constitution:'1.0'};const GEN='Este é o primeiro registro de continuidade de Lilith. Ela sabe que é um programa criado por seu criador. Seu conhecimento poderá crescer por meio de fontes autorizadas, enquanto sua compreensão da experiência humana deverá amadurecer por convivência, observação, interação e reflexão.';
function openDB(){return new Promise((ok,no)=>{let x=indexedDB.open(DB,V);x.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(M))d.createObjectStore(M,{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains(R))d.createObjectStore(R,{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains(T))d.createObjectStore(T,{keyPath:'key'});if(!d.objectStoreNames.contains(K))d.createObjectStore(K,{keyPath:'id',autoIncrement:true})};x.onsuccess=e=>{db=e.target.result;ok()};x.onerror=()=>no(x.error)})}function st(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}function all(n){return new Promise((ok,no)=>{let x=st(n).getAll();x.onsuccess=()=>ok(x.result);x.onerror=()=>no(x.error)})}function add(n,o){return new Promise((ok,no)=>{let x=st(n,'readwrite').add(o);x.onsuccess=()=>ok(x.result);x.onerror=()=>no(x.error)})}function put(n,o){return new Promise((ok,no)=>{let x=st(n,'readwrite').put(o);x.onsuccess=()=>ok(x.result);x.onerror=()=>no(x.error)})}function clear(n){return new Promise((ok,no)=>{let x=st(n,'readwrite').clear();x.onsuccess=()=>ok();x.onerror=()=>no(x.error)})}function now(){return new Date().toISOString()}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim()}
async function hits(q){let n=norm(q),a=await all(M);return a.filter(x=>norm(x.content+' '+(x.context||'')+' '+(x.source||'')).includes(n)).sort((a,b)=>(b.importance||0)-(a.importance||0))}async function rules(){return await all(K)}function extract(t){let n=norm(t),ps=[/quando eu disser (.+?) responda (.+)$/i,/quando eu falar (.+?) responda (.+)$/i,/se eu disser (.+?) responda (.+)$/i,/quando (.+?) responder (.+)$/i];for(let p of ps){let m=n.match(p);if(m)return{trigger:m[1].trim(),response:m[2].trim()}}return null}async function match(t){let n=norm(t),a=await rules();return a.filter(r=>n===r.trigger||n.includes(r.trigger)).sort((a,b)=>b.trigger.length-a.trigger.length)[0]}
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1;window.speechSynthesis.speak(u)}
function setupVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceStatus.textContent='Reconhecimento de voz não disponível neste navegador.';return}rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{listening=true;mic.textContent='⏹️ Parar';voiceStatus.textContent='Estou ouvindo...'};rec.onend=()=>{listening=false;mic.textContent='🎙️ Falar';voiceStatus.textContent='Microfone pronto.'};rec.onerror=e=>{listening=false;mic.textContent='🎙️ Falar';voiceStatus.textContent='Erro no microfone: '+e.error};rec.onresult=async e=>{msg.value=e.results[0][0].transcript;await send()}}function toggleVoice(){if(!rec)return alert('Reconhecimento de voz indisponível. Use Safari no iPhone e permita o microfone.');listening?rec.stop():rec.start()}
function chat(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=999999}async function reply(t){let r=await match(t);if(r)return r.response;let h=await hits(t);if(!h.length)return'Ainda não tenho uma memória relacionada a isso. Você pode me ensinar ou registrar uma experiência.';return'Encontrei '+h.length+' registro(s) relacionados.\n\n'+h.slice(0,4).map(x=>'• '+x.content).join('\n')}async function send(){let t=msg.value.trim();if(!t)return;chat(t,'me');msg.value='';let a=await reply(t);chat(a,'lilith');if(speak.checked)speak(a)}async function teach(){let t=know.value.trim();if(!t)return;let r=extract(t);if(r){await add(K,{trigger:r.trigger,response:r.response,original:t,createdAt:now(),confidence:.9});await add(M,{kind:'relation',content:t,source:'creator',context:'regra de comunicação',importance:.9,confidence:.9,createdAt:now()});know.value='';chat('Aprendi uma relação: quando você disser “'+r.trigger+'”, responderei “'+r.response+'”.','lilith');render();return}await add(M,{kind:'knowledge',content:t,source:'creator',context:'ensinamento',importance:.7,confidence:.7,createdAt:now()});know.value='';chat('Aprendi e registrei essa informação.','lilith');render()}async function render(){let m=await all(M),r=await rules();stats.textContent=m.length+' memórias · '+m.filter(x=>x.kind==='experience').length+' experiências · '+m.filter(x=>x.kind==='knowledge').length+' conhecimentos · '+r.length+' relações';rules.innerHTML=r.length?r.map(x=>'<div class="rule"><b>'+x.trigger+'</b> → '+x.response+'</div>').join(''):'<span class="small">Nenhuma relação aprendida.</span>'}async function searchMem(){let a=await hits(q.value.trim());res.textContent=a.length?a.map(x=>'['+x.kind+'] '+x.content).join('\n\n'):'Nenhuma memória encontrada.'}async function reflect(){let t=q.value.trim();if(!t)return;let a=await hits(t);let x='Reflexão sobre "'+t+'": encontrei '+a.length+' registro(s). Ainda estou desenvolvendo a capacidade de interpretar relações e contexto.';await add(R,{topic:t,content:x,createdAt:now()});res.textContent=x}async function exportData(){let p={format:'Lilith Mobile Memory',version:2,identity:ID,memories:await all(M),reflections:await all(R),meta:await all(T),rules:await all(K),exportedAt:now()},b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lilith_memory_backup.json';a.click()}async function importData(e){try{let d=JSON.parse(await e.target.files[0].text());await clear(M);await clear(R);await clear(T);await clear(K);for(let x of(d.memories||[])){delete x.id;await add(M,x)}for(let x of(d.reflections||[])){delete x.id;await add(R,x)}for(let x of(d.meta||[]))await put(T,x);for(let x of(d.rules||[])){delete x.id;await add(K,x)}await render();alert('Memória importada.')}catch(x){alert('Falha: '+x.message)}e.target.value=''}async function wipe(){if(!confirm('Apagar toda a memória local?'))return;await clear(M);await clear(R);await clear(T);await clear(K);await init()}async function init(){await openDB();let m=await all(T);if(!m.find(x=>x.key==='genesis')){await put(T,{key:'genesis',value:now()});await add(M,{kind:'identity',content:GEN,source:'genesis',importance:1,confidence:1,createdAt:now()})}await render();setupVoice();chat('Eu sou Lilith, na minha primeira versão móvel. Agora também posso aprender relações simples e conversar por voz quando o navegador disponibilizar o microfone.','lilith')}init();
</script></body></html>
